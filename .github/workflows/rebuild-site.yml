name: Rebuild the site

# When an entry changes on main, planesdb.com needs rebuilding - the site
# generator lives in a separate repository and pulls these entries at build
# time, so nothing here reaches the live site on its own.
#
# This validates the entries itself rather than waiting for the "Check
# entries" workflow to finish. An earlier version chained the two together
# with workflow_run, which meant any reason the check did not run - a paths
# filter that did not match, a branch being created, anything - silently
# meant no rebuild either. A deploy pipeline that can fail by simply not
# happening is worse than one that fails loudly, so the dependency is gone
# and the validation is a step in this job.

on:
  push:
    branches: [main]
    paths:
      - 'aircraft/**'
      - 'operators/**'
      - 'categories.json'
  # Forces a rebuild by hand from the Actions tab, for when the site needs
  # regenerating without an entry having changed.
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fail before spending a Netlify build on entries that cannot build.
      # Netlify would keep the previous deploy live either way, but a failure
      # here names the file and the problem, which a build log does not.
      - name: Validate entries
        run: node scripts/validate-entries.js

      - name: Trigger the Netlify build
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "The NETLIFY_BUILD_HOOK secret is not set on this repository."
            echo "Settings -> Secrets and variables -> Actions -> New repository secret,"
            echo "named NETLIFY_BUILD_HOOK, holding the build hook URL from Netlify."
            exit 1
          fi
          # -f makes curl exit non-zero on an HTTP error, so a dead or revoked
          # hook shows up as a failed run rather than a silent no-op.
          curl -fsS -X POST -d '{}' "$HOOK"
          echo "Build triggered."
